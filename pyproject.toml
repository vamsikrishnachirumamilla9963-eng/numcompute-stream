[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.1.0"
description = "Modular scientific computing toolkit — plain Python + NumPy only"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
]
[project.optional-dependencies]
dev = [
    "pytest>=7",
    "jupyter",
    "notebook",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["numcompute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"